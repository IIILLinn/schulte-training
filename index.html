<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f0e8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23202522'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='18' fill='white'%3E5%3C/text%3E%3C/svg%3E" />
    <title>舒尔特训练</title>
    <style>
:root {
  --bg: #f4f0e8;
  --surface: #fffdf8;
  --surface-strong: #ffffff;
  --ink: #202522;
  --muted: #68716c;
  --line: #ded7cb;
  --board-bg: #ebe5da;
  --accent: #e66b3d;
  --accent-deep: #b53f21;
  --success: #dcebdc;
  --success-ink: #536b59;
  --shadow: 0 24px 60px rgba(39, 43, 39, 0.08);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--bg);
}

body {
  min-height: 100vh;
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 8% 6%, rgba(230, 107, 61, 0.1), transparent 28rem),
    radial-gradient(circle at 92% 10%, rgba(120, 153, 130, 0.12), transparent 24rem),
    var(--bg);
  font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
}

button:focus-visible {
  outline: 3px solid rgba(230, 107, 61, 0.4);
  outline-offset: 3px;
}

.app-shell {
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto;
  padding: 38px 0 64px;
}

.hero {
  max-width: 720px;
  margin-bottom: 26px;
}

.eyebrow {
  margin: 0 0 7px;
  color: var(--accent-deep);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

h1,
h2,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 10px;
  font-size: clamp(2.2rem, 6vw, 4.9rem);
  line-height: 0.98;
  letter-spacing: -0.055em;
}

.hero-copy {
  max-width: 600px;
  margin-bottom: 0;
  color: var(--muted);
  font-size: clamp(0.94rem, 2vw, 1.08rem);
  line-height: 1.7;
}

.layout {
  display: grid;
  grid-template-columns: minmax(260px, 322px) minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}

.panel {
  border: 1px solid var(--line);
  border-radius: 24px;
  background: rgba(255, 253, 248, 0.92);
  box-shadow: var(--shadow);
}

.settings-panel {
  position: sticky;
  top: 22px;
  padding: 22px;
}

.training-panel {
  min-width: 0;
  display: grid;
  gap: 16px;
}

.panel-heading,
.record-heading,
.result-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.panel-heading h2,
.record-heading h2,
.result-heading h2 {
  margin-bottom: 0;
  font-size: 1.08rem;
  letter-spacing: -0.02em;
}

.panel-mark,
.result-badge {
  color: var(--accent-deep);
  font-size: 0.68rem;
  font-weight: 900;
  letter-spacing: 0.14em;
}

.field {
  margin-top: 22px;
}

.field-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 9px;
}

.field-label span {
  font-size: 0.88rem;
  font-weight: 800;
}

.field-label small {
  color: var(--muted);
  font-size: 0.7rem;
  text-align: right;
}

.choice-row,
.preset-row {
  display: grid;
  gap: 8px;
}

.choice-row {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.choice-row--four {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.choice,
.preset {
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--ink);
  background: #f8f4ed;
  cursor: pointer;
  transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
}

.choice {
  padding: 8px 7px;
  font-size: 0.78rem;
  font-weight: 800;
}

.preset {
  padding: 9px 10px;
  color: var(--muted);
  font-size: 0.75rem;
}

.choice:hover:not(:disabled),
.preset:hover:not(:disabled) {
  border-color: #b9afa1;
  transform: translateY(-1px);
}

.choice.is-active {
  color: #fff;
  background: var(--ink);
  border-color: var(--ink);
}

.choice:disabled,
.preset:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.preset-field {
  padding-top: 20px;
  border-top: 1px dashed var(--line);
}

.record-heading {
  margin-top: 26px;
  padding-top: 20px;
  border-top: 1px dashed var(--line);
}

.text-button {
  padding: 4px 0;
  border: 0;
  color: var(--accent-deep);
  background: transparent;
  font-size: 0.72rem;
  font-weight: 800;
  cursor: pointer;
}

.history-list {
  display: grid;
  gap: 8px;
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
}

.history-empty {
  padding: 12px;
  border-radius: 12px;
  color: var(--muted);
  background: #f6f2eb;
  font-size: 0.76rem;
}

.history-item {
  display: grid;
  gap: 3px;
  padding: 10px 11px;
  border: 1px solid #eee8de;
  border-radius: 12px;
  background: #fcfaf6;
  font-size: 0.74rem;
}

.history-item strong {
  font-size: 0.82rem;
}

.history-item span {
  color: var(--muted);
}

.status-panel {
  padding: 18px 20px 16px;
}

.status-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.stat {
  display: grid;
  gap: 4px;
  min-width: 0;
}

.stat-label {
  color: var(--muted);
  font-size: 0.7rem;
}

.stat strong {
  overflow: hidden;
  font-size: clamp(1.02rem, 2.5vw, 1.58rem);
  line-height: 1.05;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.progress-track {
  height: 7px;
  margin-top: 16px;
  overflow: hidden;
  border-radius: 999px;
  background: #e8e1d7;
}

.progress-bar {
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), #f0a46d);
  transition: width 180ms ease;
}

.status-message {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 0.76rem;
}

.board-wrap {
  display: grid;
  place-items: center;
  min-height: min(60vw, 560px);
  padding: clamp(12px, 2.6vw, 24px);
  border: 1px solid var(--line);
  border-radius: 28px;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.38), transparent 40%),
    var(--board-bg);
}

.board {
  width: min(100%, 500px);
  aspect-ratio: 1;
}

.board[data-shape="square"] {
  display: grid;
  grid-template-columns: repeat(var(--size), minmax(0, 1fr));
  gap: clamp(5px, 1vw, 10px);
}

.board[data-shape="square"] .cell {
  width: 100%;
  aspect-ratio: 1;
}

.board[data-shape="circle"] {
  position: relative;
}

.board[data-shape="circle"] .cell {
  position: absolute;
  left: calc(var(--x) * 100%);
  top: calc(var(--y) * 100%);
  width: clamp(24px, calc(100% / (var(--size) + 8)), 54px);
  aspect-ratio: 1;
  font-size: clamp(0.72rem, 1.8vw, 1rem);
  transform: translate(-50%, -50%);
}

.cell {
  appearance: none;
  display: grid;
  place-items: center;
  min-width: 0;
  border: 1px solid #d8d1c6;
  border-radius: clamp(12px, 2vw, 20px);
  color: var(--ink);
  background: var(--surface-strong);
  box-shadow: 0 5px 14px rgba(32, 37, 34, 0.04);
  font-size: clamp(1rem, 3.2vw, 2rem);
  font-weight: 850;
  letter-spacing: -0.04em;
  cursor: pointer;
  user-select: none;
  transition: background 150ms ease, border-color 150ms ease, color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
}

.cell:hover:not(:disabled):not(.done) {
  border-color: #b5aa9a;
  box-shadow: 0 9px 18px rgba(32, 37, 34, 0.09);
  transform: translateY(-2px);
}

.board[data-shape="circle"] .cell:hover:not(:disabled):not(.done) {
  transform: translate(-50%, -50%) translateY(-2px);
}

.cell:disabled {
  cursor: default;
  opacity: 1;
}

.cell.done {
  color: var(--success-ink);
  background: var(--success);
  border-color: #bfd8c2;
}

.cell.wrong {
  color: var(--accent-deep);
  background: #ffe2d8;
  border-color: #efb29d;
  animation: shake 280ms ease both;
}

@keyframes shake {
  0%,
  100% { translate: 0 0; }
  30% { translate: -4px 0; }
  60% { translate: 4px 0; }
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.primary-button,
.secondary-button {
  min-height: 46px;
  padding: 0 18px;
  border-radius: 14px;
  font-size: 0.84rem;
  font-weight: 850;
  cursor: pointer;
  transition: transform 150ms ease, box-shadow 150ms ease, opacity 150ms ease;
}

.primary-button {
  border: 1px solid var(--ink);
  color: #fff;
  background: var(--ink);
  box-shadow: 0 10px 22px rgba(32, 37, 34, 0.14);
}

.secondary-button {
  border: 1px solid var(--line);
  color: var(--ink);
  background: var(--surface);
}

.primary-button:hover:not(:disabled),
.secondary-button:hover:not(:disabled) {
  transform: translateY(-2px);
}

.primary-button:disabled,
.secondary-button:disabled {
  cursor: not-allowed;
  opacity: 0.42;
}

.result-panel {
  padding: 20px;
}

.result-heading {
  margin-bottom: 18px;
}

.result-metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.result-metrics div {
  padding: 13px;
  border-radius: 14px;
  background: #f6f2eb;
}

.result-metrics span {
  display: block;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 0.7rem;
}

.result-metrics strong {
  font-size: clamp(1rem, 3vw, 1.38rem);
}

[hidden] {
  display: none !important;
}

@media (max-width: 900px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .settings-panel {
    position: static;
    order: 2;
  }

  .training-panel {
    order: 1;
  }
}

@media (max-width: 560px) {
  .app-shell {
    width: min(100% - 28px, 560px);
    padding: 24px 0 44px;
  }

  .hero {
    margin-bottom: 20px;
  }

  .settings-panel,
  .status-panel,
  .result-panel {
    border-radius: 20px;
    padding: 17px;
  }

  .board-wrap {
    min-height: min(88vw, 520px);
    border-radius: 22px;
  }

  .status-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    row-gap: 13px;
  }

  .result-metrics {
    grid-template-columns: 1fr;
  }

  .primary-button,
  .secondary-button {
    flex: 1 1 140px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

  <body>
    <div class="app-shell">
      <header class="hero">
        <p class="eyebrow">专注力训练</p>
        <h1>舒尔特方格</h1>
        <p class="hero-copy">选择训练规格，按顺序找到全部数字。保持视线稳定，不必加快呼吸。</p>
      </header>

      <main class="layout">
        <aside class="panel settings-panel" id="settings">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">训练设置</p>
              <h2>选择规格</h2>
            </div>
            <span class="panel-mark">SET</span>
          </div>

          <div class="field">
            <div class="field-label">
              <span>棋盘尺寸</span>
              <small>数字总量自动调整</small>
            </div>
            <div class="choice-row choice-row--four" role="group" aria-label="棋盘尺寸">
              <button class="choice" type="button" data-setting="size" data-value="3" aria-pressed="false">3×3</button>
              <button class="choice" type="button" data-setting="size" data-value="4" aria-pressed="false">4×4</button>
              <button class="choice" type="button" data-setting="size" data-value="5" aria-pressed="true">5×5</button>
              <button class="choice" type="button" data-setting="size" data-value="6" aria-pressed="false">6×6</button>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <span>点击顺序</span>
              <small>从起点向终点推进</small>
            </div>
            <div class="choice-row" role="group" aria-label="点击顺序">
              <button class="choice" type="button" data-setting="order" data-value="asc" aria-pressed="true">正序 1→N²</button>
              <button class="choice" type="button" data-setting="order" data-value="desc" aria-pressed="false">倒序 N²→1</button>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <span>排列方式</span>
              <small>标准训练建议随机</small>
            </div>
            <div class="choice-row" role="group" aria-label="排列方式">
              <button class="choice" type="button" data-setting="arrangement" data-value="random" aria-pressed="true">随机排列</button>
              <button class="choice" type="button" data-setting="arrangement" data-value="sequential" aria-pressed="false">顺序排列</button>
            </div>
          </div>

          <div class="field">
            <div class="field-label">
              <span>棋盘形状</span>
              <small>圆形为同心环排布</small>
            </div>
            <div class="choice-row" role="group" aria-label="棋盘形状">
              <button class="choice" type="button" data-setting="shape" data-value="square" aria-pressed="true">方形</button>
              <button class="choice" type="button" data-setting="shape" data-value="circle" aria-pressed="false">圆形</button>
            </div>
          </div>

          <div class="field preset-field">
            <div class="field-label">
              <span>快捷预设</span>
              <small>一键切换到常用规格</small>
            </div>
            <div class="preset-row">
              <button class="preset" type="button" data-preset="beginner">初级 3×3</button>
              <button class="preset" type="button" data-preset="standard">标准 5×5</button>
              <button class="preset" type="button" data-preset="advanced">进阶 6×6</button>
            </div>
          </div>

          <div class="record-heading">
            <div>
              <p class="eyebrow">训练记录</p>
              <h2>最近表现</h2>
            </div>
            <button class="text-button" id="clearBtn" type="button">清除记录</button>
          </div>
          <ol class="history-list" id="historyList"></ol>
        </aside>

        <section class="training-panel" aria-label="训练区域">
          <div class="panel status-panel">
            <div class="status-grid">
              <div class="stat">
                <span class="stat-label">用时</span>
                <strong id="timer">00:00.0</strong>
              </div>
              <div class="stat">
                <span class="stat-label">当前目标</span>
                <strong id="target">1</strong>
              </div>
              <div class="stat">
                <span class="stat-label">错误次数</span>
                <strong id="errors">0</strong>
              </div>
              <div class="stat">
                <span class="stat-label">进度</span>
                <strong id="progressText">0 / 25</strong>
              </div>
            </div>
            <div class="progress-track" aria-hidden="true">
              <div class="progress-bar" id="progressBar"></div>
            </div>
            <p class="status-message" id="statusMessage">准备好后点击“开始训练”。</p>
          </div>

          <div class="board-wrap">
            <div class="board" id="board" data-shape="square" role="grid" aria-label="舒尔特训练棋盘"></div>
          </div>

          <div class="controls">
            <button class="primary-button" id="startBtn" type="button">开始训练</button>
            <button class="secondary-button" id="restartBtn" type="button" disabled>重新开始</button>
            <button class="secondary-button" id="settingsBtn" type="button" disabled>返回设置</button>
          </div>

          <section class="panel result-panel" id="resultPanel" hidden aria-live="polite">
            <div class="result-heading">
              <div>
                <p class="eyebrow">本局结果</p>
                <h2>训练完成</h2>
              </div>
              <span class="result-badge">DONE</span>
            </div>
            <div class="result-metrics">
              <div>
                <span>本局用时</span>
                <strong id="lastTime">--</strong>
              </div>
              <div>
                <span>错误次数</span>
                <strong id="lastErrors">0</strong>
              </div>
              <div>
                <span>当前规格最佳</span>
                <strong id="bestTime">--</strong>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script>
(function (global) {
  function shuffle(items, random = Math.random) {
    const copy = [...items];
    for (let i = copy.length - 1; i > 0; i -= 1) {
      const j = Math.floor(random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function buildValues(size, order = 'asc', arrangement = 'random', random = Math.random) {
    const total = size * size;
    const values = Array.from({ length: total }, (_, index) => index + 1);
    const ordered = order === 'desc' ? values.reverse() : values;
    return arrangement === 'random' ? shuffle(ordered, random) : ordered;
  }

  function ringCounts(size) {
    if (size % 2 === 1) {
      const rings = Math.floor(size / 2);
      return [1, ...Array.from({ length: rings }, (_, index) => 8 * (index + 1))];
    }
    const rings = size / 2 - 1;
    return [4, ...Array.from({ length: rings }, (_, index) => 12 + index * 8)];
  }

  function clampPosition(value) {
    return Math.min(0.92, Math.max(0.08, value));
  }

  function createCircularSlots(size) {
    const counts = ringCounts(size);
    const slots = [];
    const centerOffset = 0.085;

    if (counts[0] === 1) {
      slots.push({ x: 0.5, y: 0.5 });
    } else {
      slots.push(
        { x: 0.5 - centerOffset, y: 0.5 - centerOffset },
        { x: 0.5 + centerOffset, y: 0.5 - centerOffset },
        { x: 0.5 - centerOffset, y: 0.5 + centerOffset },
        { x: 0.5 + centerOffset, y: 0.5 + centerOffset },
      );
    }

    const ringTotal = counts.length - 1;
    for (let ring = 1; ring <= ringTotal; ring += 1) {
      const radius = ringTotal === 1 ? 0.42 : 0.21 + (ring - 1) * 0.21;
      const count = counts[ring];
      const angleOffset = ring % 2 === 0 ? Math.PI / count : 0;
      for (let index = 0; index < count; index += 1) {
        const angle = -Math.PI / 2 + angleOffset + (index * Math.PI * 2) / count;
        slots.push({
          x: clampPosition(0.5 + Math.cos(angle) * radius),
          y: clampPosition(0.5 + Math.sin(angle) * radius),
        });
      }
    }

    return slots;
  }

  function specKey(settings) {
    return [settings.size, settings.order, settings.arrangement, settings.shape].join('-');
  }

  function formatTime(ms) {
    const totalSeconds = Math.max(0, ms) / 1000;
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = Math.floor(totalSeconds % 60);
    const tenths = Math.floor((totalSeconds * 10) % 10);
    return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${tenths}`;
  }

  const api = { buildValues, createCircularSlots, formatTime, shuffle, specKey };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  global.SchulteCore = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

(function () {
  const core = globalThis.SchulteCore;
  const STORAGE_KEY = 'schulte-training-v1';
  const defaultSettings = {
    size: 5,
    order: 'asc',
    arrangement: 'random',
    shape: 'square',
  };

  const elements = {
    board: document.querySelector('#board'),
    settings: document.querySelector('#settings'),
    startBtn: document.querySelector('#startBtn'),
    restartBtn: document.querySelector('#restartBtn'),
    settingsBtn: document.querySelector('#settingsBtn'),
    clearBtn: document.querySelector('#clearBtn'),
    timer: document.querySelector('#timer'),
    target: document.querySelector('#target'),
    errors: document.querySelector('#errors'),
    progressText: document.querySelector('#progressText'),
    progressBar: document.querySelector('#progressBar'),
    statusMessage: document.querySelector('#statusMessage'),
    resultPanel: document.querySelector('#resultPanel'),
    lastTime: document.querySelector('#lastTime'),
    lastErrors: document.querySelector('#lastErrors'),
    bestTime: document.querySelector('#bestTime'),
    historyList: document.querySelector('#historyList'),
  };

  const state = {
    settings: { ...defaultSettings },
    phase: 'idle',
    values: [],
    current: 1,
    completed: 0,
    errors: 0,
    startedAt: 0,
    timerId: null,
    elapsed: 0,
  };

  let stats = loadStats();

  function loadStats() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (parsed && typeof parsed === 'object') {
        return { best: parsed.best || {}, records: Array.isArray(parsed.records) ? parsed.records : [] };
      }
    } catch (_error) {
      // Storage can be unavailable in private browsing contexts.
    }
    return { best: {}, records: [] };
  }

  function persistStats() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
    } catch (_error) {
      // The training still works if storage is unavailable.
    }
  }

  function totalValues() {
    return state.settings.size * state.settings.size;
  }

  function firstTarget() {
    return state.settings.order === 'asc' ? 1 : totalValues();
  }

  function nextTarget() {
    return state.settings.order === 'asc' ? state.current + 1 : state.current - 1;
  }

  function createValues() {
    return core.buildValues(
      state.settings.size,
      state.settings.order,
      state.settings.arrangement,
      Math.random,
    );
  }

  function clearTimer() {
    if (state.timerId !== null) {
      window.clearInterval(state.timerId);
      state.timerId = null;
    }
    const runningFor = state.phase === 'running' ? performance.now() - state.startedAt : state.elapsed;
    if (runningFor > 0) state.elapsed = runningFor;
  }

  function renderSettings() {
    const locked = state.phase === 'running';
    document.querySelectorAll('[data-setting]').forEach((button) => {
      const selected = String(state.settings[button.dataset.setting]) === button.dataset.value;
      button.classList.toggle('is-active', selected);
      button.setAttribute('aria-pressed', String(selected));
      button.disabled = locked;
    });
    document.querySelectorAll('[data-preset]').forEach((button) => {
      button.disabled = locked;
    });
  }

  function renderBoard(values = createValues()) {
    state.values = values;
    const size = state.settings.size;
    const shape = state.settings.shape;
    elements.board.dataset.shape = shape;
    elements.board.style.setProperty('--size', size);
    elements.board.innerHTML = '';

    const slots = shape === 'circle' ? core.createCircularSlots(size) : null;
    values.forEach((value, index) => {
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cell';
      cell.dataset.value = String(value);
      cell.setAttribute('role', 'gridcell');
      cell.setAttribute('aria-label', `数字 ${value}`);
      cell.textContent = value;
      if (slots) {
        cell.style.setProperty('--x', slots[index].x);
        cell.style.setProperty('--y', slots[index].y);
      }
      cell.addEventListener('click', () => handleCellClick(cell, value));
      elements.board.append(cell);
    });
  }

  function resetToIdle() {
    clearTimer();
    state.phase = 'idle';
    state.elapsed = 0;
    state.completed = 0;
    state.errors = 0;
    state.current = firstTarget();
    elements.resultPanel.hidden = true;
    elements.statusMessage.textContent = '准备好后点击“开始训练”。';
    renderBoard();
    renderSettings();
    updateDisplay();
    renderStats();
  }

  function startGame() {
    clearTimer();
    state.phase = 'running';
    state.elapsed = 0;
    state.completed = 0;
    state.errors = 0;
    state.current = firstTarget();
    state.startedAt = performance.now();
    elements.resultPanel.hidden = true;
    elements.statusMessage.textContent = state.settings.order === 'asc' ? '从 1 开始，依次点击到终点。' : `从 ${totalValues()} 开始倒序点击。`;
    renderBoard();
    renderSettings();
    updateDisplay();
    state.timerId = window.setInterval(updateTimer, 100);
  }

  function updateTimer() {
    if (state.phase !== 'running') return;
    state.elapsed = performance.now() - state.startedAt;
    elements.timer.textContent = core.formatTime(state.elapsed);
  }

  function updateDisplay() {
    const total = totalValues();
    const targetValue = state.phase === 'complete' ? '完成' : state.current;
    elements.timer.textContent = core.formatTime(state.elapsed);
    elements.target.textContent = targetValue;
    elements.errors.textContent = state.errors;
    elements.progressText.textContent = `${state.completed} / ${total}`;
    elements.progressBar.style.width = `${(state.completed / total) * 100}%`;
    elements.startBtn.disabled = state.phase === 'running';
    elements.restartBtn.disabled = state.phase === 'idle';
    elements.settingsBtn.disabled = state.phase === 'idle';
  }

  function handleCellClick(cell, value) {
    if (state.phase !== 'running') return;
    if (value !== state.current) {
      state.errors += 1;
      cell.classList.add('wrong');
      window.setTimeout(() => cell.classList.remove('wrong'), 320);
      elements.statusMessage.textContent = `先找 ${state.current}，不要急着跳数字。`;
      updateDisplay();
      return;
    }

    cell.classList.add('done');
    cell.disabled = true;
    state.completed += 1;
    if (state.completed >= totalValues()) {
      state.current = null;
      finishGame();
      return;
    }
    state.current = nextTarget();
    elements.statusMessage.textContent = `很好，继续找 ${state.current}。`;
    updateDisplay();
  }

  function finishGame() {
    state.elapsed = performance.now() - state.startedAt;
    if (state.timerId !== null) {
      window.clearInterval(state.timerId);
      state.timerId = null;
    }
    state.phase = 'complete';
    state.current = null;
    saveResult();
    updateDisplay();
    renderSettings();
    renderStats();
    elements.statusMessage.textContent = '训练完成，成绩已记录。';
    elements.resultPanel.hidden = false;
  }

  function saveResult() {
    const settings = { ...state.settings };
    const key = core.specKey(settings);
    const previousBest = stats.best[key];
    if (previousBest === undefined || state.elapsed < previousBest) {
      stats.best[key] = state.elapsed;
    }
    stats.records.unshift({
      key,
      settings,
      size: settings.size,
      order: settings.order,
      arrangement: settings.arrangement,
      shape: settings.shape,
      ms: state.elapsed,
      errors: state.errors,
      completedAt: Date.now(),
    });
    stats.records = stats.records.slice(0, 5);
    persistStats();
  }

  function orderLabel(order) {
    return order === 'asc' ? '正序' : '倒序';
  }

  function arrangementLabel(arrangement) {
    return arrangement === 'random' ? '随机' : '顺序';
  }

  function shapeLabel(shape) {
    return shape === 'circle' ? '圆形' : '方形';
  }

  function specLabel(settings) {
    return `${settings.size}×${settings.size} ${shapeLabel(settings.shape)} · ${orderLabel(settings.order)} · ${arrangementLabel(settings.arrangement)}`;
  }

  function renderStats() {
    const currentKey = core.specKey(state.settings);
    const best = stats.best[currentKey];
    elements.bestTime.textContent = best === undefined ? '--' : core.formatTime(best);
    const latestForSpec = stats.records.find((record) => record.key === currentKey);
    elements.lastTime.textContent = latestForSpec ? core.formatTime(latestForSpec.ms) : '--';
    elements.lastErrors.textContent = latestForSpec ? latestForSpec.errors : '0';
    renderHistory();
  }

  function renderHistory() {
    elements.historyList.innerHTML = '';
    if (stats.records.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'history-empty';
      empty.textContent = '还没有训练记录。';
      elements.historyList.append(empty);
      return;
    }

    stats.records.forEach((record) => {
      const item = document.createElement('li');
      item.className = 'history-item';
      const main = document.createElement('strong');
      main.textContent = `${core.formatTime(record.ms)} · ${record.errors} 错`;
      const detail = document.createElement('span');
      detail.textContent = specLabel(record.settings);
      item.append(main, detail);
      elements.historyList.append(item);
    });
  }

  function setSetting(key, value) {
    if (state.phase === 'running') return;
    if (state.phase === 'complete') {
      state.phase = 'idle';
      elements.resultPanel.hidden = true;
    }
    state.settings[key] = key === 'size' ? Number(value) : value;
    state.phase = 'idle';
    state.elapsed = 0;
    state.completed = 0;
    state.errors = 0;
    state.current = firstTarget();
    renderSettings();
    renderBoard();
    updateDisplay();
    renderStats();
  }

  function applyPreset(preset) {
    if (state.phase === 'running') return;
    const presets = {
      beginner: { size: 3, order: 'asc', arrangement: 'random', shape: 'square' },
      standard: { size: 5, order: 'asc', arrangement: 'random', shape: 'square' },
      advanced: { size: 6, order: 'asc', arrangement: 'random', shape: 'circle' },
    };
    state.settings = { ...presets[preset] };
    state.phase = 'idle';
    state.elapsed = 0;
    state.completed = 0;
    state.errors = 0;
    state.current = firstTarget();
    elements.resultPanel.hidden = true;
    renderSettings();
    renderBoard();
    updateDisplay();
    renderStats();
  }

  document.querySelectorAll('[data-setting]').forEach((button) => {
    button.addEventListener('click', () => setSetting(button.dataset.setting, button.dataset.value));
  });

  document.querySelectorAll('[data-preset]').forEach((button) => {
    button.addEventListener('click', () => applyPreset(button.dataset.preset));
  });

  elements.startBtn.addEventListener('click', startGame);
  elements.restartBtn.addEventListener('click', startGame);
  elements.settingsBtn.addEventListener('click', resetToIdle);
  elements.clearBtn.addEventListener('click', () => {
    stats = { best: {}, records: [] };
    localStorage.removeItem(STORAGE_KEY);
    renderStats();
    elements.statusMessage.textContent = '训练记录已清除。';
  });

  state.values = createValues();
  state.current = firstTarget();
  renderSettings();
  renderBoard(state.values);
  updateDisplay();
  renderStats();
})();

    </script>
  </body>
</html>
