<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f0e8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23202522'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='18' fill='white'%3E5%3C/text%3E%3C/svg%3E" />
    <title>舒尔特训练</title>
    <style>
:root {
  --bg: #f4f0e8;
  --surface: #fffdf8;
  --surface-strong: #ffffff;
  --ink: #202522;
  --muted: #68716c;
  --line: #ded7cb;
  --board-bg: #ebe5da;
  --accent: #e66b3d;
  --accent-deep: #b53f21;
  --success: #dcebdc;
  --success-ink: #536b59;
  --shadow: 0 24px 60px rgba(39, 43, 39, 0.08);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--bg);
}

body {
  min-height: 100vh;
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 8% 6%, rgba(230, 107, 61, 0.1), transparent 28rem),
    radial-gradient(circle at 92% 10%, rgba(120, 153, 130, 0.12), transparent 24rem),
    var(--bg);
  font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
}

button:focus-visible {
  outline: 3px solid rgba(230, 107, 61, 0.4);
  outline-offset: 3px;
}

.app-shell {
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto;
  padding: 38px 0 64px;
}

.hero {
  max-width: 720px;
  margin-bottom: 26px;
}

.eyebrow {
  margin: 0 0 7px;
  color: var(--accent-deep);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

h1,
h2,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 10px;
  font-size: clamp(2.2rem, 6vw, 4.9rem);
  line-height: 0.98;
  letter-spacing: -0.055em;
}

.hero-copy {
  max-width: 600px;
  margin-bottom: 0;
  color: var(--muted);
  font-size: clamp(0.94rem, 2vw, 1.08rem);
  line-height: 1.7;
}

.layout {
  display: grid;
  grid-template-columns: minmax(260px, 322px) minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}

.panel {
  border: 1px solid var(--line);
  border-radius: 24px;
  background: rgba(255, 253, 248, 0.92);
  box-shadow: var(--shadow);
}

.settings-panel {
  position: sticky;
  top: 22px;
  padding: 22px;
}

.training-panel {
  min-width: 0;
  display: grid;
  gap: 16px;
}

.panel-heading,
.record-heading,
.result-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.panel-heading h2,
.record-heading h2,
.result-heading h2 {
  margin-bottom: 0;
  font-size: 1.08rem;
  letter-spacing: -0.02em;
}

.panel-mark,
.result-badge {
  color: var(--accent-deep);
  font-size: 0.68rem;
  font-weight: 900;
  letter-spacing: 0.14em;
}

.field {
  margin-top: 22px;
}

.field-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 9px;
}

.field-label span {
  font-size: 0.88rem;
  font-weight: 800;
}

.field-label small {
  color: var(--muted);
  font-size: 0.7rem;
  text-align: right;
}

.choice-row,
.preset-row {
  display: grid;
  gap: 8px;
}

.choice-row {
  grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
}

.choice-row--size {
  grid-template-columns: repeat(auto-fit, minmax(46px, 1fr));
}

.choice,
.preset {
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--ink);
  background: #f8f4ed;
  cursor: pointer;
  transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
}

.choice {
  padding: 8px 7px;
  font-size: 0.78rem;
  font-weight: 800;
}

.preset {
  padding: 9px 10px;
  color: var(--muted);
  font-size: 0.75rem;
}

.choice:hover:not(:disabled),
.preset:hover:not(:disabled) {
  border-color: #b9afa1;
  transform: translateY(-1px);
}

.choice.is-active {
  color: #fff;
  background: var(--ink);
  border-color: var(--ink);
}

.choice:disabled,
.preset:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.preset-field {
  padding-top: 20px;
  border-top: 1px dashed var(--line);
}

.record-heading {
  margin-top: 26px;
  padding-top: 20px;
  border-top: 1px dashed var(--line);
}

.text-button {
  padding: 4px 0;
  border: 0;
  color: var(--accent-deep);
  background: transparent;
  font-size: 0.72rem;
  font-weight: 800;
  cursor: pointer;
}

.history-list {
  display: grid;
  gap: 8px;
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
}

.history-empty {
  padding: 12px;
  border-radius: 12px;
  color: var(--muted);
  background: #f6f2eb;
  font-size: 0.76rem;
}

.history-item {
  display: grid;
  gap: 3px;
  padding: 10px 11px;
  border: 1px solid #eee8de;
  border-radius: 12px;
  background: #fcfaf6;
  font-size: 0.74rem;
}

.history-item strong {
  font-size: 0.82rem;
}

.history-item span {
  color: var(--muted);
}

.status-panel {
  padding: 18px 20px 16px;
}

.status-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.stat {
  display: grid;
  gap: 4px;
  min-width: 0;
}

.stat-label {
  color: var(--muted);
  font-size: 0.7rem;
}

.stat strong {
  overflow: hidden;
  font-size: clamp(1.02rem, 2.5vw, 1.58rem);
  line-height: 1.05;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.progress-track {
  height: 7px;
  margin-top: 16px;
  overflow: hidden;
  border-radius: 999px;
  background: #e8e1d7;
}

.progress-bar {
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), #f0a46d);
  transition: width 180ms ease;
}

.status-message {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 0.76rem;
}

.board-wrap {
  display: grid;
  place-items: center;
  min-height: min(60vw, 560px);
  padding: clamp(12px, 2.6vw, 24px);
  border: 1px solid var(--line);
  border-radius: 28px;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.38), transparent 40%),
    var(--board-bg);
}

.board {
  width: min(100%, 500px);
  aspect-ratio: 1;
}

.board[data-shape="square"] {
  display: grid;
  grid-template-columns: repeat(var(--size), minmax(0, 1fr));
  gap: clamp(5px, 1vw, 10px);
}

.board[data-shape="square"] .cell {
  width: 100%;
  aspect-ratio: 1;
}

.board[data-shape="circle"] {
  position: relative;
  isolation: isolate;
}

.shape-outline {
  position: absolute;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}

.board[data-shape="circle"] .shape-outline circle {
  fill: rgba(255, 255, 255, 0.42);
  stroke: #bdb4a6;
  stroke-width: 1;
  stroke-dasharray: 3 3;
}

.board[data-shape="circle"] .cell {
  position: absolute;
  left: calc(var(--x) * 100%);
  top: calc(var(--y) * 100%);
  width: min(64px, calc(100% / var(--cell-divisor)));
  aspect-ratio: 1;
  z-index: 1;
  border-radius: var(--radius, 50%);
  font-size: clamp(0.72rem, 1.8vw, 1rem);
  transform: translate(-50%, -50%) scale(var(--scale, 1));
}

.cell {
  appearance: none;
  display: grid;
  place-items: center;
  min-width: 0;
  border: 1px solid #d8d1c6;
  border-radius: clamp(12px, 2vw, 20px);
  color: var(--ink);
  background: var(--surface-strong);
  box-shadow: 0 5px 14px rgba(32, 37, 34, 0.04);
  font-size: clamp(1rem, 3.2vw, 2rem);
  font-weight: 850;
  letter-spacing: -0.04em;
  cursor: pointer;
  user-select: none;
  transition: background 150ms ease, border-color 150ms ease, color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
}

.cell:hover:not(:disabled):not(.correct) {
  border-color: #b5aa9a;
  box-shadow: 0 9px 18px rgba(32, 37, 34, 0.09);
  transform: translateY(-2px);
}

.board[data-shape="circle"] .cell:hover:not(:disabled):not(.correct) {
  transform: translate(-50%, -50%) scale(var(--scale, 1)) translateY(-2px);
}

.cell:disabled {
  cursor: default;
  opacity: 1;
}

.cell.correct {
  color: var(--success-ink);
  background: #e2f1e4;
  border-color: #9ecaa5;
  animation: correctPulse 380ms ease-out both;
}

.cell.wrong {
  color: var(--accent-deep);
  background: #ffe2d8;
  border-color: #efb29d;
  animation: shake 280ms ease both;
}

@keyframes shake {
  0%,
  100% { translate: 0 0; }
  30% { translate: -4px 0; }
  60% { translate: 4px 0; }
}

@keyframes correctPulse {
  0% { box-shadow: 0 0 0 0 rgba(100, 173, 112, 0); }
  42% { box-shadow: 0 0 0 8px rgba(100, 173, 112, 0.22); }
  100% { box-shadow: 0 0 0 0 rgba(100, 173, 112, 0); }
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.primary-button,
.secondary-button {
  min-height: 46px;
  padding: 0 18px;
  border-radius: 14px;
  font-size: 0.84rem;
  font-weight: 850;
  cursor: pointer;
  transition: transform 150ms ease, box-shadow 150ms ease, opacity 150ms ease;
}

.primary-button {
  border: 1px solid var(--ink);
  color: #fff;
  background: var(--ink);
  box-shadow: 0 10px 22px rgba(32, 37, 34, 0.14);
}

.secondary-button {
  border: 1px solid var(--line);
  color: var(--ink);
  background: var(--surface);
}

.primary-button:hover:not(:disabled),
.secondary-button:hover:not(:disabled) {
  transform: translateY(-2px);
}

.primary-button:disabled,
.secondary-button:disabled {
  cursor: not-allowed;
  opacity: 0.42;
}

.result-panel {
  padding: 20px;
}

.result-heading {
  margin-bottom: 18px;
}

.result-metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.result-metrics div {
  padding: 13px;
  border-radius: 14px;
  background: #f6f2eb;
}

.result-metrics span {
  display: block;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 0.7rem;
}

.result-metrics strong {
  font-size: clamp(1rem, 3vw, 1.38rem);
}

[hidden] {
  display: none !important;
}

@media (max-width: 900px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .settings-panel {
    position: static;
    order: 2;
  }

  .training-panel {
    order: 1;
  }
}

@media (max-width: 560px) {
  .app-shell {
    width: min(100% - 28px, 560px);
    padding: 24px 0 44px;
  }

  .hero {
    margin-bottom: 20px;
  }

  .settings-panel,
  .status-panel,
  .result-panel {
    border-radius: 20px;
    padding: 17px;
  }

  .board-wrap {
    min-height: min(88vw, 520px);
    border-radius: 22px;
  }

  .status-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    row-gap: 13px;
  }

  .result-metrics {
    grid-template-columns: 1fr;
  }

  .primary-button,
  .secondary-button {
    flex: 1 1 140px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <p class="eyebrow">专注力训练</p>
        <h1>舒尔特方格</h1>
        <p class="hero-copy">选择棋盘形状和数字数量，按 1 到终点的顺序完成训练。保持视线稳定，不必加快呼吸。</p>
      </header>

      <main class="layout">
        <aside class="panel settings-panel" id="settings">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">训练设置</p>
              <h2>选择规格</h2>
            </div>
            <span class="panel-mark">SET</span>
          </div>

          <div class="field">
            <div class="field-label">
              <span>棋盘尺寸</span>
              <small>数字总量自动调整</small>
            </div>
            <div class="choice-row choice-row--size" id="sizeChoices" role="group" aria-label="棋盘尺寸"></div>
          </div>

          <div class="field">
            <div class="field-label">
              <span>棋盘形状</span>
              <small>圆形也随机散布</small>
            </div>
            <div class="choice-row" role="group" aria-label="棋盘形状">
              <button class="choice" type="button" data-setting="shape" data-value="square" aria-pressed="true">方形</button>
              <button class="choice" type="button" data-setting="shape" data-value="circle" aria-pressed="false">圆形</button>
            </div>
          </div>

          <div class="field preset-field">
            <div class="field-label">
              <span>快捷预设</span>
              <small>一键切换到常用规格</small>
            </div>
            <div class="preset-row">
              <button class="preset" type="button" data-preset="beginner">初级 3×3</button>
              <button class="preset" type="button" data-preset="standard">标准 5×5</button>
            </div>
          </div>

          <div class="record-heading">
            <div>
              <p class="eyebrow">训练记录</p>
              <h2>最近表现</h2>
            </div>
            <button class="text-button" id="clearBtn" type="button">清除记录</button>
          </div>
          <ol class="history-list" id="historyList"></ol>
        </aside>

        <section class="training-panel" aria-label="训练区域">
          <div class="panel status-panel">
            <div class="status-grid">
              <div class="stat">
                <span class="stat-label">用时</span>
                <strong id="timer">00:00.0</strong>
              </div>
              <div class="stat">
                <span class="stat-label">当前目标</span>
                <strong id="target">1</strong>
              </div>
              <div class="stat">
                <span class="stat-label">错误次数</span>
                <strong id="errors">0</strong>
              </div>
              <div class="stat">
                <span class="stat-label">进度</span>
                <strong id="progressText">0 / 25</strong>
              </div>
            </div>
            <div class="progress-track" aria-hidden="true">
              <div class="progress-bar" id="progressBar"></div>
            </div>
            <p class="status-message" id="statusMessage">准备好后点击“开始训练”。</p>
          </div>

          <div class="board-wrap">
            <div class="board" id="board" data-shape="square" role="grid" aria-label="舒尔特训练棋盘"></div>
          </div>

          <div class="controls">
            <button class="primary-button" id="startBtn" type="button">开始训练</button>
            <button class="secondary-button" id="restartBtn" type="button" disabled>重新开始</button>
            <button class="secondary-button" id="settingsBtn" type="button" disabled>返回设置</button>
          </div>

          <section class="panel result-panel" id="resultPanel" hidden aria-live="polite">
            <div class="result-heading">
              <div>
                <p class="eyebrow">本局结果</p>
                <h2>训练完成</h2>
              </div>
              <span class="result-badge">DONE</span>
            </div>
            <div class="result-metrics">
              <div>
                <span>本局用时</span>
                <strong id="lastTime">--</strong>
              </div>
              <div>
                <span>错误次数</span>
                <strong id="lastErrors">0</strong>
              </div>
              <div>
                <span>当前规格最佳</span>
                <strong id="bestTime">--</strong>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script>
(function (global) {
  function shuffle(items, random = Math.random) {
    const copy = [...items];
    for (let i = copy.length - 1; i > 0; i -= 1) {
      const j = Math.floor(random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function buildValues(count, random = Math.random) {
    return shuffle(Array.from({ length: count }, (_, index) => index + 1), random);
  }

  function clamp(value, minimum, maximum) {
    return Math.min(maximum, Math.max(minimum, value));
  }

  function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function pairwiseMinDistance(points) {
    let minimum = Infinity;
    for (let i = 0; i < points.length; i += 1) {
      for (let j = i + 1; j < points.length; j += 1) {
        minimum = Math.min(minimum, distance(points[i], points[j]));
      }
    }
    return Number.isFinite(minimum) ? minimum : 1;
  }

  function selectCandidates(candidates, count, random) {
    const shuffled = shuffle(candidates, random);
    if (shuffled.length <= count) return shuffled;

    const radiusLimit = 0.75;
    const boundary = shuffled.filter((candidate) => candidate.radius >= radiusLimit);
    const boundaryTarget = Math.min(boundary.length, Math.max(4, Math.round(count * 0.24)));
    const selected = boundary.slice(0, boundaryTarget);
    const selectedSet = new Set(selected);

    for (const candidate of shuffled) {
      if (selected.length >= count) break;
      if (!selectedSet.has(candidate)) {
        selected.push(candidate);
        selectedSet.add(candidate);
      }
    }
    return selected;
  }

  function createCircleOutline(radius = 0.45, segments = 64) {
    return Array.from({ length: segments }, (_, index) => {
      const angle = (index / segments) * Math.PI * 2;
      return {
        x: clamp(0.5 + Math.cos(angle) * radius, 0.03, 0.97),
        y: clamp(0.5 + Math.sin(angle) * radius, 0.03, 0.97),
      };
    });
  }

  function createCircularLayout(count, random = Math.random) {
    let gridSize = Math.max(5, Math.ceil(Math.sqrt(count / 0.58)));
    let candidates = [];
    let spacing = 1 / gridSize;

    while (gridSize <= 20) {
      candidates = [];
      spacing = 1 / gridSize;
      const boundaryRadius = 0.455;
      for (let row = 0; row < gridSize; row += 1) {
        for (let column = 0; column < gridSize; column += 1) {
          const x = (column + 0.5) * spacing;
          const y = (row + 0.5) * spacing;
          const radius = Math.hypot(x - 0.5, y - 0.5);
          if (radius <= boundaryRadius - spacing * 0.25) candidates.push({ x, y, radius });
        }
      }
      if (candidates.length >= count + Math.max(4, Math.round(count * 0.12))) break;
      gridSize += 1;
    }

    const selected = selectCandidates(candidates, count, random);
    const jitter = spacing * 0.08;
    const slots = selected.map((candidate) => ({
      x: clamp(candidate.x + (random() - 0.5) * jitter * 2, 0.04, 0.96),
      y: clamp(candidate.y + (random() - 0.5) * jitter * 2, 0.04, 0.96),
    }));
    const actualMin = pairwiseMinDistance(slots);
    return {
      slots: shuffle(slots, random),
      cellRatio: Math.min(0.14, actualMin * 0.78),
      outline: createCircleOutline(),
    };
  }

  function objective(values, slots) {
    let minimum = Infinity;
    let total = 0;
    const slotByValue = new Map();
    slots.forEach((slot, index) => slotByValue.set(values[index], slot));
    for (let value = 1; value < values.length; value += 1) {
      const current = distance(slotByValue.get(value), slotByValue.get(value + 1));
      minimum = Math.min(minimum, current);
      total += current;
    }
    return minimum + total * 0.0001;
  }

  function assignValuesToSlots(slots, random = Math.random) {
    const count = slots.length;
    if (count === 0) return [];

    const unvisited = slots.map((_, index) => index);
    const path = [];
    let currentIndex = unvisited.splice(Math.floor(random() * unvisited.length), 1)[0];
    path.push(currentIndex);

    while (unvisited.length > 0) {
      let bestDistance = -Infinity;
      let bestCandidates = [];
      for (const index of unvisited) {
        const currentDistance = distance(slots[currentIndex], slots[index]);
        if (currentDistance > bestDistance + 1e-9) {
          bestDistance = currentDistance;
          bestCandidates = [index];
        } else if (Math.abs(currentDistance - bestDistance) <= 1e-9) {
          bestCandidates.push(index);
        }
      }
      currentIndex = bestCandidates[Math.floor(random() * bestCandidates.length)];
      unvisited.splice(unvisited.indexOf(currentIndex), 1);
      path.push(currentIndex);
    }

    const values = new Array(count);
    path.forEach((slotIndex, valueIndex) => {
      values[slotIndex] = valueIndex + 1;
    });

    let bestScore = objective(values, slots);
    const iterations = count * 260;
    for (let iteration = 0; iteration < iterations; iteration += 1) {
      const first = Math.floor(random() * count);
      const second = Math.floor(random() * count);
      if (first === second) continue;
      [values[first], values[second]] = [values[second], values[first]];
      const nextScore = objective(values, slots);
      if (nextScore >= bestScore) {
        bestScore = nextScore;
      } else {
        [values[first], values[second]] = [values[second], values[first]];

  }

  function createSquareLayout(size) {
    const slots = [];
    for (let row = 0; row < size; row += 1) {
      for (let column = 0; column < size; column += 1) {
        slots.push({
          x: (column + 0.5) / size,
          y: (row + 0.5) / size,

      }

  }

  function specKey(settings) {
    if (settings.shape === 'square') return `square-${settings.squareSize}x${settings.squareSize}`;
    return `${settings.shape}-${settings.count}`;
  }

  function formatTime(ms) {
    const totalSeconds = Math.max(0, ms) / 1000;
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = Math.floor(totalSeconds % 60);
    const tenths = Math.floor((totalSeconds * 10) % 10);

(function () {
  const core = globalThis.SchulteCore;
  const STORAGE_KEY = 'schulte-training-v1';
  const SQUARE_SIZES = [3, 4, 5, 6, 7];
  const COUNT_SIZES = [15, 20, 25, 30, 35, 40, 45, 50];
  const defaultSettings = {
    shape: 'square',
    squareSize: 5,
    count: 25,
  };

  const elements = {
    board: document.querySelector('#board'),
    settings: document.querySelector('#settings'),
    sizeChoices: document.querySelector('#sizeChoices'),
    startBtn: document.querySelector('#startBtn'),
    restartBtn: document.querySelector('#restartBtn'),
    settingsBtn: document.querySelector('#settingsBtn'),
    clearBtn: document.querySelector('#clearBtn'),
    timer: document.querySelector('#timer'),
    target: document.querySelector('#target'),
    errors: document.querySelector('#errors'),
    progressText: document.querySelector('#progressText'),
    progressBar: document.querySelector('#progressBar'),
    statusMessage: document.querySelector('#statusMessage'),
    resultPanel: document.querySelector('#resultPanel'),
    lastTime: document.querySelector('#lastTime'),
    lastErrors: document.querySelector('#lastErrors'),
    bestTime: document.querySelector('#bestTime'),
    historyList: document.querySelector('#historyList'),
  };

  const state = {
    settings: { ...defaultSettings },
    phase: 'idle',
    values: [],
    layout: null,
    total: 25,
    current: 1,
    completed: 0,
    errors: 0,
    startedAt: 0,
    timerId: null,
    elapsed: 0,
  };

  let stats = loadStats();

  function loadStats() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (parsed && typeof parsed === 'object') {
        return { best: parsed.best || {}, records: Array.isArray(parsed.records) ? parsed.records : [] };
      }
    } catch (_error) {
      // Storage can be unavailable in private browsing contexts.
    }
    return { best: {}, records: [] };
  }

  function persistStats() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
    } catch (_error) {
      // The training still works if storage is unavailable.
    }
  }

  function currentTotal() {
    return state.settings.shape === 'square'
      ? state.settings.squareSize * state.settings.squareSize
      : state.settings.count;
  }

  function clearTimer() {
    if (state.timerId !== null) {
      window.clearInterval(state.timerId);
      state.timerId = null;
    }
    if (state.phase === 'running') state.elapsed = performance.now() - state.startedAt;
  }

  function renderSizeChoices() {
    const isSquare = state.settings.shape === 'square';
    const options = isSquare
      ? SQUARE_SIZES.map((size) => ({ value: size, label: `${size}×${size}` }))
      : COUNT_SIZES.map((count) => ({ value: count, label: String(count) }));
    const selectedValue = isSquare ? state.settings.squareSize : state.settings.count;
    elements.sizeChoices.innerHTML = '';
    options.forEach((option) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'choice';
      button.dataset.setting = 'size';
      button.dataset.value = String(option.value);
      button.textContent = option.label;
      button.setAttribute('aria-pressed', String(option.value === selectedValue));
      if (option.value === selectedValue) button.classList.add('is-active');
      elements.sizeChoices.append(button);
    });
  }

  function renderSettings() {
    renderSizeChoices();
    const locked = state.phase === 'running';
    document.querySelectorAll('[data-setting]').forEach((button) => {
      const selected = button.dataset.setting === 'shape'
        ? button.dataset.value === state.settings.shape
        : Number(button.dataset.value) === (state.settings.shape === 'square' ? state.settings.squareSize : state.settings.count);
      button.classList.toggle('is-active', selected);
      button.setAttribute('aria-pressed', String(selected));
      button.disabled = locked;
    });
    document.querySelectorAll('[data-preset]').forEach((button) => {
      button.disabled = locked;
    });
  }

  function createLayout(random) {
    if (state.settings.shape === 'square') return core.createSquareLayout(state.settings.squareSize);
    return core.createCircularLayout(state.settings.count, random);
  }

  function renderBoard(random = Math.random) {
    const layout = createLayout(random);
    const values = core.assignValuesToSlots(layout.slots, random);
    state.layout = layout;
    state.values = values;
    state.total = values.length;

    elements.board.dataset.shape = state.settings.shape;
    elements.board.style.setProperty('--size', state.settings.shape === 'square' ? state.settings.squareSize : 0);
    elements.board.style.setProperty('--cell-divisor', String(1 / layout.cellRatio));
    elements.board.innerHTML = '';

    if (layout.outline) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.classList.add('shape-outline');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.setAttribute('aria-hidden', 'true');
      if (state.settings.shape === 'circle') {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '50');
        circle.setAttribute('cy', '50');
        circle.setAttribute('r', '45');
        svg.append(circle);
      } else {
        const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        polygon.setAttribute('points', layout.outline.map((point) => `${point.x * 100},${point.y * 100}`).join(' '));
        svg.append(polygon);
      }
      elements.board.append(svg);
    }

    values.forEach((value, index) => {
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cell';
      cell.dataset.value = String(value);
      cell.setAttribute('role', 'gridcell');
      cell.setAttribute('aria-label', `数字 ${value}`);
      cell.textContent = value;

      if (state.settings.shape !== 'square') {
        const slot = layout.slots[index];
        cell.style.setProperty('--x', slot.x);
        cell.style.setProperty('--y', slot.y);
        cell.style.setProperty('--scale', '1');
        cell.style.setProperty('--radius', '50%');
      }

      cell.addEventListener('click', () => handleCellClick(cell, value));
      elements.board.append(cell);
    });
  }

  function setPreviewState() {
    clearTimer();
    state.phase = 'idle';
    state.elapsed = 0;
    state.completed = 0;
    state.errors = 0;
    state.current = 1;
    state.total = currentTotal();
    elements.resultPanel.hidden = true;
    elements.statusMessage.textContent = '准备好后点击“开始训练”。';
  }

  function resetToIdle() {
    setPreviewState();
    renderBoard();
    renderSettings();
    updateDisplay();
    renderStats();
  }

  function startGame() {
    clearTimer();
    state.phase = 'running';
    state.elapsed = 0;
    state.completed = 0;
    state.errors = 0;
    state.current = 1;
    renderBoard();
    state.startedAt = performance.now();
    state.total = state.values.length;
    elements.resultPanel.hidden = true;
    elements.statusMessage.textContent = `从 1 开始，依次点击到 ${state.total}。`;
    renderSettings();
    updateDisplay();
    state.timerId = window.setInterval(updateTimer, 100);
  }

  function updateTimer() {
    if (state.phase !== 'running') return;
    state.elapsed = performance.now() - state.startedAt;
    elements.timer.textContent = core.formatTime(state.elapsed);
  }

  function updateDisplay() {
    const total = state.total || currentTotal();
    elements.timer.textContent = core.formatTime(state.elapsed);
    elements.target.textContent = state.phase === 'complete' ? '完成' : state.current;
    elements.errors.textContent = state.errors;
    elements.progressText.textContent = `${state.completed} / ${total}`;
    elements.progressBar.style.width = `${(state.completed / total) * 100}%`;
    elements.startBtn.disabled = state.phase === 'running';
    elements.restartBtn.disabled = state.phase === 'idle';
    elements.settingsBtn.disabled = state.phase === 'idle';
  }

  function handleCellClick(cell, value) {
    if (state.phase !== 'running') return;
    if (value !== state.current) {
      state.errors += 1;
      cell.classList.add('wrong');
      window.setTimeout(() => cell.classList.remove('wrong'), 330);
      elements.statusMessage.textContent = `先找 ${state.current}，不要急着跳数字。`;
      updateDisplay();
      return;
    }

    cell.disabled = true;
    cell.classList.add('correct');
    window.setTimeout(() => cell.classList.remove('correct'), 380);
    state.completed += 1;

    if (state.completed >= state.total) {
      state.current = null;
      finishGame();
      return;
    }

    state.current += 1;
    elements.statusMessage.textContent = `很好，继续找 ${state.current}。`;
    updateDisplay();
  }

  function finishGame() {
    state.elapsed = performance.now() - state.startedAt;
    if (state.timerId !== null) {
      window.clearInterval(state.timerId);
      state.timerId = null;
    }
    state.phase = 'complete';
    saveResult();
    updateDisplay();
    renderSettings();
    renderStats();
    elements.statusMessage.textContent = '训练完成，成绩已记录。';
    elements.resultPanel.hidden = false;
  }

  function saveResult() {
    const settings = { ...state.settings };
    const key = core.specKey(settings);
    const previousBest = stats.best[key];
    if (previousBest === undefined || state.elapsed < previousBest) stats.best[key] = state.elapsed;
    stats.records.unshift({
      key,
      settings,
      ms: state.elapsed,
      errors: state.errors,
      completedAt: Date.now(),
    });
    stats.records = stats.records.slice(0, 5);
    persistStats();
  }

  function shapeLabel(shape) {
    return shape === 'circle' ? '圆形' : '方形';
  }

  function specLabel(settings) {
    if (settings.shape === 'square') return `${settings.squareSize}×${settings.squareSize} 方形`;
    return `${settings.count} 个数字 · ${shapeLabel(settings.shape)}`;
  }

  function renderStats() {
    const currentKey = core.specKey(state.settings);
    const best = stats.best[currentKey];
    elements.bestTime.textContent = best === undefined ? '--' : core.formatTime(best);
    const latestForSpec = stats.records.find((record) => record.key === currentKey);
    elements.lastTime.textContent = latestForSpec ? core.formatTime(latestForSpec.ms) : '--';
    elements.lastErrors.textContent = latestForSpec ? latestForSpec.errors : '0';
    renderHistory();
  }

  function renderHistory() {
    elements.historyList.innerHTML = '';
    if (stats.records.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'history-empty';
      empty.textContent = '还没有训练记录。';
      elements.historyList.append(empty);
      return;
    }

    stats.records.forEach((record) => {
      const item = document.createElement('li');
      item.className = 'history-item';
      const main = document.createElement('strong');
      main.textContent = `${core.formatTime(record.ms)} · ${record.errors} 错`;
      const detail = document.createElement('span');
      detail.textContent = specLabel(record.settings);
      item.append(main, detail);
      elements.historyList.append(item);
    });
  }

  function setSetting(key, value) {
    if (state.phase === 'running') return;
    if (key === 'shape') {
      state.settings.shape = value;
      if (value === 'square' && !SQUARE_SIZES.includes(state.settings.squareSize)) state.settings.squareSize = 5;
      if (value !== 'square' && !COUNT_SIZES.includes(state.settings.count)) state.settings.count = 25;
    } else if (key === 'size') {
      if (state.settings.shape === 'square') state.settings.squareSize = Number(value);
      else state.settings.count = Number(value);
    }
    setPreviewState();
    renderSettings();
    renderBoard();
    updateDisplay();
    renderStats();
  }

  function applyPreset(preset) {
    if (state.phase === 'running') return;
    const presets = {
      beginner: { shape: 'square', squareSize: 3, count: 25 },
      standard: { shape: 'square', squareSize: 5, count: 25 },
    };
    state.settings = { ...presets[preset] };
    setPreviewState();
    renderSettings();
    renderBoard();
    updateDisplay();
    renderStats();
  }

  elements.settings.addEventListener('click', (event) => {
    const button = event.target.closest('[data-setting], [data-preset]');
    if (!button) return;
    if (button.dataset.preset) {
      applyPreset(button.dataset.preset);
      return;
    }
    setSetting(button.dataset.setting, button.dataset.value);
  });

  elements.startBtn.addEventListener('click', startGame);
  elements.restartBtn.addEventListener('click', startGame);
  elements.settingsBtn.addEventListener('click', resetToIdle);
  elements.clearBtn.addEventListener('click', () => {
    stats = { best: {}, records: [] };
    localStorage.removeItem(STORAGE_KEY);
    renderStats();
    elements.statusMessage.textContent = '训练记录已清除。';
  });

  state.total = currentTotal();
  renderSettings();
  renderBoard();
  updateDisplay();
  renderStats();
})();

    </script>
  </body>
